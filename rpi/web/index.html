<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEDMatrix Pi Test</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    .object { display: grid; grid-template-columns: 8rem 1fr 1fr 1fr 3rem; gap: .5rem; align-items: end; margin: 1rem 0; }
    label { display: block; font-size: .8rem; }
    input, button { box-sizing: border-box; font: inherit; padding: .55rem; width: 100%; }
    button { cursor: pointer; }
    .emoji-control { position: relative; }
    .emoji-current { display: flex; align-items: center; gap: .4rem; min-height: 2.5rem; text-align: left; }
    .emoji-current img, .emoji-option img { width: 2rem; height: 2rem; object-fit: contain; }
    .emoji-menu { display: none; position: absolute; z-index: 2; top: calc(100% + .25rem); left: 0; width: 16rem; max-height: 20rem; overflow-y: auto; padding: .35rem; background: #20242c; border: 1px solid #596170; border-radius: .4rem; box-shadow: 0 .5rem 1rem #0008; }
    .emoji-control.open .emoji-menu { display: grid; gap: .2rem; }
    .emoji-option { display: flex; align-items: center; gap: .5rem; border: 0; background: transparent; color: inherit; text-align: left; }
    .emoji-option:hover { background: #343b48; }
    #panelControls { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: 1rem 0; }
    #panelControls strong { width: 100%; }
    #panelControls button { width: auto; }
    #status { min-height: 1.5rem; margin-top: 1rem; color: #9f9; }
  </style>
</head>
<body>
  <h1>LEDMatrix Pi Test</h1>
  <p>Full wall coordinates: X 0-255, Y 0-63.</p>
  <div id="objects"></div>
    <button id="add">Add pixel art</button>
    <div id="panelControls" aria-label="Panel blanking controls"></div>
  <label for="color">Background color</label>
  <input id="color" type="color" value="#202020">
  <label for="brightness">Brightness: <span id="brightnessValue">0</span></label>
  <input id="brightness" type="range" min="0" max="255" value="0">
  <button id="send">Update display</button>
  <div id="status" role="status"></div>
  <script>
    const emojis = [
      {value: '😀', label: '😀'}, {value: '🙂', label: '🙂'}, {value: '❤️', label: '❤️'},
      {value: '⭐', label: '⭐'}, {value: '👍', label: '👍'}, {value: '⬆️', label: '⬆️'},
      {value: '⬇️', label: '⬇️'}, {value: '🔥', label: '🔥'}, {value: '💰', label: '💰'},
      {value: '🤑', label: '🤑'}, {value: '🖕', label: '🖕'}, {value: '🤬', label: '🤬'},
      {value: '🤮', label: '🤮'}, {value: '👎', label: '👎'},
      {value: 'fuck-off-smiley', label: 'fuck-off-smiley', image: '/fuck-off-smiley.png'},
      {value: 'fuck-you-smiley', label: 'fuck-you-smiley', image: '/fuck-you-smiley.png'},
      {value: 'fuck-you-double-text', label: 'fuck-you-double-text', image: '/fuck-you-double-text.png'},
      {value: 'fuck-you-double', label: 'fuck-you-double', image: '/fuck-you-double.png'},
      {value: 'fuck-afd', label: 'fuck-afd', image: '/fuck-afd.png'}
    ];
    const $ = id => document.getElementById(id);
    let panelCount = 1;
    let blankPanels = [];
    function emojiMarkup(item, className) {
      return item.image ? `<img class="${className}-image" src="${item.image}" alt=""> <span>${item.label}</span>` : `<span>${item.label}</span>`;
    }
    function addObject(item = {emoji: '🔥', x: 0, y: 0, size: 56}) {
      const row = document.createElement('div'); row.className = 'object';
      row.innerHTML = `<label>Emoji<div class="emoji-control"><button class="emoji-current" type="button"></button><div class="emoji-menu">${emojis.map(e => `<button class="emoji-option" type="button" data-value="${e.value}">${emojiMarkup(e, 'emoji-option')}</button>`).join('')}</div><input class="emoji-value" type="hidden"></div></label>
        <label>X<input class="x" type="number" min="0" max="255"></label>
        <label>Y<input class="y" type="number" min="0" max="63"></label>
        <label>Size<input class="size" type="number" min="8" max="64"></label>
        <button class="remove" type="button">Remove</button>`;
      const control = row.querySelector('.emoji-control');
      const current = row.querySelector('.emoji-current');
      const value = row.querySelector('.emoji-value');
      const setEmoji = selected => {
        const option = emojis.find(candidate => candidate.value === selected) || emojis[0];
        value.value = option.value; current.innerHTML = emojiMarkup(option, 'emoji-current');
      };
      setEmoji(item.emoji); current.onclick = () => control.classList.toggle('open');
      row.querySelectorAll('.emoji-option').forEach(option => option.onclick = () => { setEmoji(option.dataset.value); control.classList.remove('open'); });
      row.querySelector('.x').value = item.x;
      row.querySelector('.y').value = item.y; row.querySelector('.size').value = item.size;
      row.querySelector('.remove').onclick = () => row.remove(); $('objects').append(row);
    }
    $('add').onclick = () => addObject();
    function renderPanelControls() {
      const allBlank = blankPanels.length === panelCount;
      $('panelControls').innerHTML = `<strong>Panels</strong> ${Array.from({length: panelCount}, (_, panel) => {
        const blank = blankPanels.includes(panel);
        return `<button type="button" data-panel="${panel}">${blank ? 'Restore' : 'Blank'} panel ${panel + 1}</button>`;
      }).join(' ')} <button type="button" data-all="true">${allBlank ? 'Restore' : 'Blank'} all panels</button>`;
      $('panelControls').querySelectorAll('button').forEach(button => button.onclick = async () => {
        const next = button.dataset.all
          ? (allBlank ? [] : Array.from({length: panelCount}, (_, panel) => panel))
          : (blankPanels.includes(Number(button.dataset.panel))
            ? blankPanels.filter(panel => panel !== Number(button.dataset.panel))
            : [...blankPanels, Number(button.dataset.panel)]);
        const response = await fetch('/api/display', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({blankPanels: next})});
        if (!response.ok) { $('status').textContent = 'Error blanking panels'; return; }
        blankPanels = next.sort((a, b) => a - b); renderPanelControls();
        $('status').textContent = blankPanels.length ? 'Selected panels blanked' : 'All panels restored';
      });
    }
    $('brightness').oninput = () => $('brightnessValue').textContent = $('brightness').value;
    $('send').onclick = async () => {
      const items = [...document.querySelectorAll('.object')].map(row => ({
        emoji: row.querySelector('.emoji-value').value, x: Number(row.querySelector('.x').value),
        y: Number(row.querySelector('.y').value), size: Number(row.querySelector('.size').value)
      }));
      const hex = $('color').value;
      const body = {objects: items, brightness: Number($('brightness').value), color: {
        r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16)
      }};
      $('status').textContent = 'Sending...';
      try { const response = await fetch('/api/display', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        if (!response.ok) throw new Error(await response.text()); $('status').textContent = 'Display updated';
      } catch (error) { $('status').textContent = 'Error: ' + error.message; }
    };
    addObject({emoji: '😀', x: 4, y: 4, size: 56});
    fetch('/api/state').then(response => response.json()).then(state => {
      panelCount = state.panelCount || 1;
      blankPanels = (state.panels?.[0]?.blankPanels || []).slice();
      renderPanelControls();
    }).catch(() => renderPanelControls());
  </script>
</body>
</html>
